<script>
// The installed app is laid out from 100vh, a browser tab from the dynamic viewport
// (css/app.css, --vh). CSS sees the installed app through the display-mode media feature;
// this adds the older iOS signal so that app can never be mistaken for a tab.
if (navigator.standalone === true) document.documentElement.setAttribute('data-display', 'standalone');
</script>
<!-- DOM contract (docs/SPEC.md §7–8): these roots must exist and #sheetRoot/#toastRoot/#gateRoot stay empty in HTML -->
<div id="app"></div>
<div id="sheetRoot"></div>
<div id="toastRoot"></div>
<div id="gateRoot"></div>
<script>
// Touch guards. Inline and classic on purpose: they must hold from the first frame, before the
// game modules have loaded (js/main.js adds the same once it runs; doubling them is harmless).
(function () {
  function block(e) { e.preventDefault(); }
  // Safari ignores user-scalable=no in a tab, so stop the pinch by hand.
  document.addEventListener('gesturestart', block, { passive: false });
  document.addEventListener('gesturechange', block, { passive: false });
  // No "copy / look up" callout from a long press on the board or a fighter.
  var app = document.getElementById('app');
  if (app) app.addEventListener('contextmenu', block);
  // An (empty) touchstart listener is what makes :active styles apply on iOS.
  document.addEventListener('touchstart', function () {}, { passive: true });
})();
</script>
<script type="module" src="js/main.js"></script>
<script>
// Load watchdog. The game, the install guide and every message live behind js/main.js and
// its imports. If one of those files cannot be fetched, nothing ever runs and the page would
// stay an empty purple screen, with no way to reload in the installed app.
// - `error` on the script element fires when main.js or any module it imports fails to load.
// - A request that just hangs fires nothing, so a timer covers it. That notice goes away by
//   itself if the modules do arrive (`load` fires once main.js has run).
// This script runs while the page is still being parsed, before either event can fire.
(function () {
  var script = document.querySelector('script[type="module"][src="js/main.js"]');
  var root = document.getElementById('gateRoot');
  if (!script || !root) return;
  var SLOW_MS = 12000;
  var notice = null;

  function hide() {
    if (notice && notice.parentNode) notice.parentNode.removeChild(notice);
    notice = null;
  }

  function show(failed) {
    hide();
    notice = document.createElement('section');
    notice.className = 'gate gate--notice';
    notice.setAttribute('role', 'alert');
    notice.innerHTML =
      '<div class="gate__inner"><header class="gate__head">' +
      '<p class="gate__headline">' + (failed ? '불러오지 못했어요' : '불러오는 중이에요') + '</p>' +
      '<p class="gate__lead">' + (failed
        ? '연결을 확인하고<br>다시 시도해 주세요.'
        : '연결이 느린 것 같아요.<br>조금 더 기다리거나 다시 시도해 주세요.') + '</p>' +
      '</header><button type="button" class="gate-btn gate-btn--primary">다시 시도</button></div>';
    notice.querySelector('button').addEventListener('click', function () { location.reload(); });
    root.appendChild(notice);
  }

  var timer = setTimeout(function () { show(false); }, SLOW_MS);
  script.addEventListener('load', function () { clearTimeout(timer); hide(); });
  script.addEventListener('error', function () { clearTimeout(timer); show(true); });
})();
</script>
