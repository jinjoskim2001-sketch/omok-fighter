<div class="row dark" id="smalld"></div>
<script>
(async () => {
  // pull the finished 비곰 art from the quality-bar file
  const html = await fetch('bigom.html').then(r => r.text()).catch(() => '');
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const bear = doc.querySelector('#tpl-bigom')?.content.querySelector('svg.ch');
  const st = doc.querySelector('style');
  if (st) document.head.append(st);
  const svgs = [...document.querySelectorAll('#defs > svg')];
  for (const s of svgs) if (s.dataset.from && bear) { s.innerHTML = bear.innerHTML; s.classList.add('ch', 'ch-bigom'); }
  for (const [id, px, label] of [['big', 150, true], ['small', 48, false], ['smalld', 48, false]]) {
    for (const s of svgs) {
      const c = document.createElement('div'); c.className = 'cell';
      const k = s.cloneNode(true); k.setAttribute('width', px); k.setAttribute('height', px); k.removeAttribute('hidden');
      c.append(k); if (label) c.append(Object.assign(document.createElement('div'), { textContent: s.dataset.name }));
      document.getElementById(id).append(c);
    }
  }
  document.title = 'ready';
})();
</script>
</body></html>
